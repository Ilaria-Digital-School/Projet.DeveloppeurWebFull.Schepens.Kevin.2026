<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beauté Glam - Page d'administration</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <header>
        <h1>Beauté Glam - Page d'administration</h1>
        <nav>
            <a href="../index.html">Accueil</a>
            <a href="soins.html">Soins</a>
            <a href="onglerie.html">Onglerie</a>
            <a href="epilations.html">Épilations</a>
            <a href="beaute.html">Beauté</a>
            <a href="prendre_rdv.html">Prendre RDV</a>
            <a href="a_propos.html">À propos</a>
            <a href="admin.html">Page administration</a>
        </nav>
    </header>
    <main>
        <section class="bloc_ajout_prestation">
            <form id="ajouter_prestation" action="">

                <div class="block_part">
                    <label for="nom_prestation">Nom de la prestation</label>
                    <input type="text" id="nom_prestation" placeholder="Nom de la prestation" required>
                </div>

                <div class="block_part">
                    <label for="description_prestation">Description de la prestation</label>
                    <textarea name="description_prestation" id="description_prestation" placeholder="Description de la prestation"></textarea>
                </div>

                <div class="block_part">
                    <label for="duree_description">Durée de la prestation</label>
                    <input type="number" step="any" id="duree_prestation" placeholder="Durée de la prestation">
                </div>

                <div class="block_part">
                    <label for="prix_prestation">Prix de la prestation</label>
                    <input type="number" step="any" id="prix_prestation" placeholder="Prix de la prestation">
                </div>

                <div class="block_part_boutons">
                    <button type="submit">Envoyer</button>
                    <button type="reset">Réinitialiser les champs</button>
                </div>

            </form>
        </section>
    </main>
    <footer>
        <div class="reseaux_sociaux">
            <a href=""><i class="fa-brands fa-facebook"></i></a>
            <a href=""><i class="fa-brands fa-square-instagram"></i></a>
            <a href=""><i class="fa-brands fa-tiktok"></i></a>
        </div>
        <div>
            <p>Mentions légales</p>
        </div>
    </footer>
</body>
</html>
